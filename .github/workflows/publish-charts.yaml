name: Release Charts

on:
  workflow_dispatch:
    inputs:
      operator_version:
        description: 'Operator version to use'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Update Chart Values
        run: |
          # Update the operator image tag in values.yaml
          sed -i "s/tag: .*/tag: ${{ inputs.operator_version }}/" k8s/charts/orc/values.yaml

          # Commit and push changes
          git add k8s/charts/orc/values.yaml
          git commit -m "chore: update operator image tag to ${{ inputs.operator_version }}"
          git push

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      - name: Add repositories
        run: |
          for dir in $(ls -d k8s/charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done

      - name: Build chart dependencies
        run: |
          for dir in k8s/charts/*/
          do
              (cd ${dir}; helm dependency build)
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: k8s/charts
          config: './.github/configs/cr.yaml'
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CR_SKIP_EXISTING: true
